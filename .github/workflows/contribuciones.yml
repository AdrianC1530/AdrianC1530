name: Contribuciones

# Vuelve a dibujar assets/contribuciones.svg una vez al día.
on:
  schedule:
    - cron: '17 5 * * *' # 00:17 en Ecuador
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dibujar las contribuciones
        run: node scripts/contribuciones.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar el cambio
        run: |
          if git diff --quiet -- assets/contribuciones.svg; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribuciones.svg
          git commit -m "Actualizar las contribuciones"
          git push
