name: Actividad

# Vuelve a dibujar las tres cifras de actividad una vez al día.
on:
  schedule:
    - cron: '17 5 * * *' # 00:17 en Ecuador
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dibujar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dibujar las cifras
        run: node scripts/actividad.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar el cambio
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar las cifras de actividad"
          git push
